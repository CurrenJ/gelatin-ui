plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
//    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/mods.toml') {
        expand([
                'version': project.version,
                'mod_license': rootProject.mod_license,
                'mod_id': rootProject.mod_id,
                'mod_name': rootProject.mod_name,
                'mod_authors': rootProject.mod_authors,
                'mod_description': rootProject.mod_description,
                'mod_icon': rootProject.mod_icon,
                'mod_minecraft_version_range': "[${rootProject.minecraft_version},)"
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

sourceSets.main.resources.srcDir("src/main/generated")

// Gradle 9.2+ requires explicit duplicatesStrategy when sources overlap.
tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
    // G2 (docs/backport-pass2/track-b-1.20.1.md): 1.20.1 Forge, unlike NeoForge, needs its
    // mixin configs declared here (mods.toml has no [[mixins]] table on this Forge line) - see
    // Fishtastic's own forge/build.gradle for the same pattern.
    forge {
        mixinConfig "gelatinui-forge.mixins.json"
    }

    runs {
        data {
            forgeTemplate("data")
            programArgs "--mod", "gelatinui",
                    "--all",
                    "--output", file("src/main/generated").absolutePath
        }
    }
}