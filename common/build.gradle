architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/gelatinui.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury injectables (annotations only, no runtime API needed for 26.1)
    implementation "dev.architectury:architectury-injectables:1.0.13"

    // Unit testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

// Use JUnit Platform for unit tests
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
