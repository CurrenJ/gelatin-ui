# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Signing configuration
signing.gnupg.executable=/opt/homebrew/bin/gpg

# Mod properties
mod_version = 1.0.38
mod_description =
mod_id = gelatinui
mod_name = Gelatin UI
mod_authors = grill24
mod_license = CC0-1.0
mod_icon = icon.png
mod_minecraft_version_range = [${minecraft_version},)
mod_fabric_minecraft_version = ~${minecraft_version}
maven_group = io.github.currenj.gelatinui
archives_name = gelatinui
enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version=1.20.1

# Dependencies
# G2.1 (docs/backport-pass2/track-b-1.20.1.md): matches port/1.20.1's own pins
# (see fishtastic gradle.properties) for the same reasons - architectury-loom 1.11
# fails FAPI 0.92.12+1.20.1 remapping, 1.17-SNAPSHOT is the working line.
# architectury_api_version: needs verification against maven.architectury.dev's
# 1.20.1 releases before the first real build - not confirmed against the repo yet.
architectury_api_version = 9.2.14
fabric_loader_version = 0.16.14
fabric_api_version = 0.92.12+1.20.1
forge_version = 47.4.23
